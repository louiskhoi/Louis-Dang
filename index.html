<!DOCTYPE html>

<html data-theme="dark" lang="vi">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta content="Portfolio cá nhân của Đặng Nguyễn Minh Khôi — Nuôi trồng Thủy sản, phát triển bền vững, giao lưu quốc tế, TRIbaLINGUAL, VietShrimp, nhiếp ảnh và hành trình khám phá Việt Nam." name="description"/>
<meta content="#07141b" name="theme-color"/>
<title>Đặng Nguyễn Minh Khôi | Aquaculture • Sustainability • Global Journey</title>
<style>
    :root{
      --bg:#07141b;
      --bg2:#0b2029;
      --card:rgba(255,255,255,.055);
      --card-strong:rgba(255,255,255,.095);
      --text:#edf8f6;
      --muted:#a9c1c1;
      --line:rgba(255,255,255,.12);
      --ocean:#37d6c0;
      --sky:#5ab7ff;
      --coral:#ff7a66;
      --sun:#f5cb68;
      --navy:#08344c;
      --shadow:0 28px 70px rgba(0,0,0,.26);
      --radius:28px;
      --radius-sm:18px;
      --max:1180px;
    }
    html[data-theme="light"]{
      --bg:#f3f8f6;
      --bg2:#e8f2f2;
      --card:rgba(255,255,255,.72);
      --card-strong:#ffffff;
      --text:#10272d;
      --muted:#536a6e;
      --line:rgba(16,39,45,.12);
      --navy:#0e5272;
      --shadow:0 22px 55px rgba(26,74,83,.14);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:92px}
    body{
      margin:0;
      background:
        radial-gradient(circle at 10% 10%, rgba(55,214,192,.11), transparent 28rem),
        radial-gradient(circle at 90% 8%, rgba(90,183,255,.11), transparent 26rem),
        var(--bg);
      color:var(--text);
      font-family:"Be Vietnam Pro",system-ui,-apple-system,sans-serif;
      line-height:1.7;
      overflow-x:hidden;
      transition:background .35s,color .35s;
    }
    ::selection{background:var(--ocean);color:#04262d}
    a{color:inherit;text-decoration:none}
    img{display:block;max-width:100%}
    button,input,textarea{font:inherit}
    .container{width:min(var(--max),calc(100% - 40px));margin-inline:auto}
    .eyebrow{
      display:inline-flex;align-items:center;gap:9px;
      font-size:.76rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
      color:var(--ocean)
    }
    .eyebrow::before{content:"";width:26px;height:2px;background:currentColor;border-radius:99px}
    .section{padding:108px 0;position:relative}
    .section-head{
      display:grid;grid-template-columns:1fr minmax(320px,520px);align-items:end;gap:32px;margin-bottom:46px
    }
    .section-title{
      font-family:"DM Serif Display",Georgia,serif;
      font-size:clamp(2.35rem,5vw,4.8rem);line-height:.98;letter-spacing:-.035em;margin:8px 0 0
    }
    .section-lead{color:var(--muted);margin:0;font-size:1rem}
    .glass{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(16px)}
    .tag{
      display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border:1px solid var(--line);
      border-radius:999px;background:var(--card);font-size:.76rem;color:var(--muted)
    }
    .tag b{color:var(--text)}
    .reveal{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease}
    .reveal.visible{opacity:1;transform:none}

    /* top progress + nav */
    #progress{position:fixed;z-index:9999;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--ocean),var(--sky),var(--coral));box-shadow:0 0 18px var(--ocean)}
    .nav{
      position:fixed;z-index:999;top:15px;left:50%;transform:translateX(-50%);
      width:min(1180px,calc(100% - 28px));height:64px;border-radius:22px;
      display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 22px;
      background:rgba(5,18,24,.66);border:1px solid rgba(255,255,255,.12);
      backdrop-filter:blur(18px);box-shadow:0 12px 36px rgba(0,0,0,.18)
    }
    html[data-theme="light"] .nav{background:rgba(249,252,251,.82);border-color:rgba(16,39,45,.1)}
    .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em}
    .brand-mark{
      width:34px;height:34px;display:grid;place-items:center;border-radius:11px;
      background:linear-gradient(135deg,var(--ocean),var(--sky));color:#06222b;font-weight:900
    }
    .brand small{display:block;font-size:.54rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-top:-4px}
    .nav-links{display:flex;align-items:center;gap:4px}
    .nav-links a{padding:9px 11px;border-radius:12px;color:var(--muted);font-size:.8rem;font-weight:600}
    .nav-links a:hover,.nav-links a.active{color:var(--text);background:var(--card)}
    .nav-actions{display:flex;align-items:center;gap:8px}
    .icon-btn{
      width:38px;height:38px;border-radius:12px;border:1px solid var(--line);
      background:var(--card);color:var(--text);cursor:pointer;display:grid;place-items:center
    }
    .menu-btn{display:none}
    .mobile-menu{display:none}

    /* Google Translate Overrides */
    .goog-te-banner-frame, .goog-te-balloon-frame, #goog-gt-tt { display: none !important; }
    body { top: 0 !important; }
    #google_translate_element { display: none !important; }
    .goog-text-highlight { background: transparent !important; box-shadow: none !important; }

      content:"";position:absolute;inset:0;z-index:-2;
      background-image:
